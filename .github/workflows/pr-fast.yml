name: PR fast checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-fast-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: changes
        name: 검사 범위 결정
        shell: bash
        run: |
          files="$(git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD")"
          if grep -Eq '^(src/|test/|scripts/|supabase/|architecture/|\.github/|package(-lock)?\.json$|playwright\.config\.mjs$|proxy\.ts$|vercel\.json$|next\.config\.|tsconfig\.json$|vitest\.config\.|eslint\.config\.)' <<<"$files"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq '^(supabase/migrations/|package(-lock)?\.json$|proxy\.ts$|vercel\.json$|vitest\.config\.|tsconfig\.json$|next\.config\.)' <<<"$files"; then
            echo "full=true" >> "$GITHUB_OUTPUT"
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.changes.outputs.run == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.13.0
          cache: npm

      - if: steps.changes.outputs.run == 'true'
        name: 도구 버전 확인
        shell: bash
        run: |
          test "$(node --version)" = "v24.13.0"
          test "$(npm --version)" = "11.6.2"

      - if: steps.changes.outputs.run == 'true'
        run: npm ci --ignore-scripts

      - if: steps.changes.outputs.run == 'true'
        run: npm run lint

      - if: steps.changes.outputs.run == 'true'
        run: npm run typecheck

      - if: steps.changes.outputs.run == 'true'
        run: npm run verify:architecture

      - if: steps.changes.outputs.run == 'true'
        run: npm run test:safety

      - if: steps.changes.outputs.run == 'true' && steps.changes.outputs.full == 'false'
        run: npm run test:component

      - if: steps.changes.outputs.run == 'true' && steps.changes.outputs.full == 'false'
        run: npm run test -- --changed "origin/${GITHUB_BASE_REF}" --passWithNoTests

      - if: steps.changes.outputs.run == 'true' && steps.changes.outputs.full == 'true'
        run: npm run test

      - if: steps.changes.outputs.run == 'false'
        run: echo "문서 전용 변경이라 코드 검사를 생략했습니다."
