name: Preview authenticated E2E

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Exact approved Vercel Preview origin
        required: true
        type: string
      deployment_sha:
        description: Git SHA attached to the approved Vercel Preview
        required: true
        type: string

permissions:
  contents: read
  deployments: read

concurrency:
  group: preview-full-e2e
  cancel-in-progress: false

jobs:
  authenticated:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: preview-e2e
    env:
      CI: "true"
      PLAYWRIGHT_BASE_URL: ${{ inputs.base_url }}
      E2E_ALLOW_PREVIEW_MUTATION: "1"
      E2E_EXPECTED_GIT_REF: ${{ vars.PREVIEW_E2E_ALLOWED_GIT_REF }}
      E2E_EXPECTED_PREVIEW_ORIGIN: ${{ inputs.base_url }}
      E2E_EXPECTED_SUPABASE_PROJECT_REF: ${{ vars.PREVIEW_EXPECTED_SUPABASE_PROJECT_REF }}
      E2E_TARGET_DEPLOYMENT_SHA: ${{ inputs.deployment_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - name: 검사 도구 SHA 기록
        shell: bash
        run: echo "E2E_CHECK_RUNNER_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Preview URL과 배포 SHA 대조
        uses: actions/github-script@v7
        env:
          APPROVED_DEPLOYMENT_SHA: ${{ inputs.deployment_sha }}
          APPROVED_PREVIEW_REF: ${{ vars.PREVIEW_E2E_ALLOWED_GIT_REF }}
          APPROVED_PREVIEW_ORIGIN: ${{ inputs.base_url }}
        with:
          script: |
            const expectedSha = process.env.APPROVED_DEPLOYMENT_SHA;
            const allowedRef = process.env.APPROVED_PREVIEW_REF;
            const expectedOrigin = new URL(process.env.APPROVED_PREVIEW_ORIGIN).origin;
            if (!allowedRef || allowedRef === 'main') {
              core.setFailed('PREVIEW_E2E_ALLOWED_GIT_REF에는 승인된 Preview 전용 브랜치가 필요합니다.');
              return;
            }
            const { data: branch } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: allowedRef,
            });
            if (branch.commit.sha !== expectedSha) {
              core.setFailed('입력 SHA가 승인된 Preview 전용 브랜치의 현재 HEAD가 아닙니다.');
              return;
            }
            if (branch.protected !== true) {
              core.setFailed('승인된 Preview 전용 브랜치에 GitHub 보호 규칙이 없습니다.');
              return;
            }
            const { data: deployments } = await github.rest.repos.listDeployments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: expectedSha,
              per_page: 100,
            });
            let matched = false;
            for (const deployment of deployments) {
              const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: deployment.id,
                per_page: 100,
              });
              matched ||= deployment.ref === allowedRef && statuses.some((status) =>
                status.state === 'success' &&
                status.environment === 'Preview' &&
                status.environment_url &&
                new URL(status.environment_url).origin === expectedOrigin
              );
            }
            if (!matched) core.setFailed('입력 URL과 SHA에 일치하는 성공한 Preview 배포가 없습니다.');

      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run test:safety
      - run: npm run verify:architecture:static
      - run: npx playwright install --with-deps chromium
      - id: e2e
        run: npm run test:e2e:authenticated
        timeout-minutes: 35
        env:
          PREVIEW_E2E_ADMIN_EMAIL: ${{ secrets.PREVIEW_E2E_ADMIN_EMAIL }}
          PREVIEW_E2E_ADMIN_PASSWORD: ${{ secrets.PREVIEW_E2E_ADMIN_PASSWORD }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: 중단 뒤 가짜 학생 정리 확인
        if: >-
          always() &&
          steps.e2e.outcome != '' &&
          steps.e2e.outcome != 'skipped'
        timeout-minutes: 8
        run: npm run test:e2e:cleanup
        env:
          PREVIEW_E2E_ADMIN_EMAIL: ${{ secrets.PREVIEW_E2E_ADMIN_EMAIL }}
          PREVIEW_E2E_ADMIN_PASSWORD: ${{ secrets.PREVIEW_E2E_ADMIN_PASSWORD }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-e2e-cleanup-receipts
          path: |
            test-results/e2e-manifests/*.json
            test-results/e2e-receipts/*.json
          if-no-files-found: warn
          retention-days: 7
